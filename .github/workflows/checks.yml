name: Checks
on:
  push:
    branches: [main, feat/github-pages-demo]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify month selector behavior
        run: npm run test:month
      - name: Build backend-connected frontend
        run: npm run build
      - name: Build GitHub Pages demo
        run: npm run build
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE_PATH: '/PersonalManagement/'
      - name: Install Chromium for gesture tests
        run: npx playwright install chromium --only-shell
      - name: Test mouse drag, resize and mobile long press
        run: npm run test:e2e
      - name: Verify Pages asset paths
        run: grep -q '/PersonalManagement/assets/' dist/index.html
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t personalmanagement:ci .
